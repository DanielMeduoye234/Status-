<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Base -->
  <rect width="512" height="512" rx="128" ry="128" fill="url(#bgGrad)" />
  
  <!-- Subtle Internal Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.2" />
  
  <!-- Stylized Geometric "S" Shape with Smooth Curves -->
  <path d="M 345 155 C 345 155 235 155 210 155 C 165 155 135 185 135 225 C 135 265 165 285 210 285 L 302 285 C 347 285 377 305 377 345 C 377 385 347 415 302 415 L 165 415" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="56" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- Live Status Pulse Indicator Dot -->
  <circle cx="376" cy="140" r="26" fill="#38bdf8" />
  <circle cx="376" cy="140" r="14" fill="#ffffff" />
</svg>
